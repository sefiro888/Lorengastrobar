<!doctype html>
<html lang="es"><head><meta charset="utf-8"><title>Navidad</title>
<link rel="stylesheet" href="../../css/fuentes.css">
<style>
  :root { --maiz:#e8b43a; --maiz2:#f4d27a; --crema:#f3eedc; --vino:#2a000e; }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:1080px; height:1920px; overflow:hidden; background:#120a0c; }
  #lienzo { position:relative; width:1080px; height:1920px; overflow:hidden; font-family:Montserrat,sans-serif; color:var(--crema);
    background:#151012 url("../../img/kv/textura-oscura.webp") center/cover; }
  #lienzo::before { content:""; position:absolute; inset:0; background:radial-gradient(80% 50% at 50% 42%, rgba(125,11,46,.6), transparent 72%), linear-gradient(rgba(21,16,18,.45), rgba(21,16,18,.55)); }
  .esc { position:absolute; inset:0; visibility:hidden; }
  .fondo { position:absolute; inset:-140px; background-size:cover; background-position:center; filter:blur(46px) saturate(1.2) brightness(.28); }
  .flor { position:absolute; left:50%; top:760px; width:1400px; height:1400px; margin:-700px 0 0 -700px; opacity:.18; mix-blend-mode:screen; }
  .marco { position:absolute; border-radius:40px; overflow:hidden; background:#000;
    box-shadow:0 0 0 10px var(--crema), 0 0 0 22px rgba(232,180,58,.95), 0 40px 90px rgba(0,0,0,.65), 0 0 140px 30px rgba(232,180,58,.28); }
  .marco img { width:100%; height:100%; display:block; object-fit:cover; }
  .marco.sin { background:radial-gradient(circle at 50% 45%, #3d0014, #1c0009); }
  .marco.sin img { object-fit:contain; padding:8%; opacity:.85; }
  .brillo { position:absolute; top:-20%; bottom:-20%; width:34%; left:-50%; background:linear-gradient(100deg, transparent, rgba(255,255,255,.5), transparent); transform:skewX(-18deg); }
  .txt { position:absolute; left:0; right:0; top:1215px; display:flex; flex-direction:column; align-items:center; text-align:center; }
  .nom { font-family:Anton; text-transform:uppercase; color:var(--crema); font-size:118px; line-height:1; text-shadow:0 6px 30px rgba(0,0,0,.9), 0 2px 6px rgba(0,0,0,.8); }
  .sub { font-family:"Kaushan Script"; color:var(--maiz2); font-size:66px; line-height:1.15; -webkit-text-stroke:2px rgba(42,0,14,.55); paint-order:stroke fill; text-shadow:0 4px 24px rgba(0,0,0,.95); transform:rotate(-3deg); }
  .items { margin-top:18px; padding:0 70px; font-weight:700; font-size:34px; line-height:1.35; text-shadow:0 3px 14px rgba(0,0,0,.95), 0 0 30px rgba(0,0,0,.8); }
  .items i { font-style:normal; color:var(--maiz2); }
  .pre { margin-top:22px; display:inline-flex; align-items:baseline; gap:18px; background:#59011d; border:4px solid var(--maiz); border-radius:22px 56px 22px 56px; padding:12px 40px; box-shadow:0 20px 40px -10px rgba(0,0,0,.8), 0 0 40px rgba(232,180,58,.3); }
  .pre small { font-weight:800; font-size:30px; letter-spacing:.08em; text-transform:uppercase; color:var(--maiz2); }
  .pre b { font-family:Anton; font-weight:400; font-size:84px; color:#fff; }
  .eyebrow { font-weight:800; font-size:36px; letter-spacing:.28em; text-transform:uppercase; color:var(--maiz2); text-shadow:0 0 30px rgba(0,0,0,.95), 0 3px 14px rgba(0,0,0,.9); }
  .anton { font-family:Anton; text-transform:uppercase; color:var(--crema); line-height:.96; text-shadow:0 8px 40px rgba(0,0,0,.9); }
  .kau { font-family:"Kaushan Script"; color:var(--maiz2); -webkit-text-stroke:2px rgba(42,0,14,.55); paint-order:stroke fill; text-shadow:0 4px 30px rgba(0,0,0,.95); }
  .centro { position:absolute; left:0; right:0; text-align:center; }
  .pill { display:inline-block; background:var(--maiz); color:var(--vino); font-weight:800; font-size:48px; padding:24px 58px; border-radius:999px; box-shadow:0 20px 44px -10px rgba(232,180,58,.6); }
  #logo { position:absolute; left:50%; top:250px; width:270px; margin-left:-135px; z-index:30; filter:drop-shadow(0 8px 18px rgba(0,0,0,.7)); }
  #nieve, #colg { position:absolute; inset:0; z-index:20; pointer-events:none; }
  #nieve img { position:absolute; left:0; top:0; opacity:.55; filter:drop-shadow(0 0 8px rgba(244,210,122,.6)); }
  #nieve b { position:absolute; left:0; top:0; color:var(--maiz2); font-size:30px; text-shadow:0 0 16px rgba(244,210,122,.95), 0 0 3px #fff; }
  #bokeh { position:absolute; inset:0; z-index:1; pointer-events:none; }
  #bokeh i { position:absolute; left:0; top:0; border-radius:50%; filter:blur(7px); }
  #guir { position:absolute; left:0; top:0; z-index:21; pointer-events:none; }
  .bomb { position:absolute; border-radius:50%; z-index:22; }
  .colg .tapa { flex:none; width:24%; height:12px; border-radius:3px 3px 1px 1px; background:linear-gradient(90deg, #8a5a10, #f4d27a 45%, #8a5a10); margin-bottom:-2px; position:relative; z-index:2; }
  .colg .bola::after { content:""; position:absolute; left:18%; top:12%; width:30%; height:20%; border-radius:50%; background:rgba(255,255,255,.55); filter:blur(3px); }
  .colg .bola.vino { background:radial-gradient(circle at 34% 30%, #ffd0d8 0, #b0405f 20%, #59011d 60%, #1c0009 100%); box-shadow:0 0 40px rgba(176,64,95,.6), 0 12px 26px rgba(0,0,0,.5); }
  .colg .bola.vino img { mix-blend-mode:screen; opacity:.55; filter:sepia(1) saturate(2.5) hue-rotate(5deg) brightness(1.1); }
  #nieve img { filter:drop-shadow(0 0 6px rgba(255,248,225,.9)) drop-shadow(0 0 14px rgba(244,210,122,.5)) !important; }
  .cinta { display:inline-block; position:relative; font-family:"Kaushan Script"; color:#2a000e; font-size:60px; background:linear-gradient(90deg, #c98e1e, #f4d27a 30%, #fff1c2 50%, #f4d27a 70%, #c98e1e);
    padding:8px 54px 12px; box-shadow:0 14px 30px -8px rgba(0,0,0,.75), 0 0 30px rgba(244,210,122,.4); transform:rotate(-2deg); }
  .cinta::before, .cinta::after { content:""; position:absolute; top:22%; width:44px; height:76%; background:#a9761c; z-index:-1; }
  .cinta::before { left:-26px; clip-path:polygon(0 0, 100% 0, 100% 100%, 0 100%, 40% 50%); }
  .cinta::after { right:-26px; clip-path:polygon(0 0, 100% 0, 60% 50%, 100% 100%, 0 100%); }
  .colg { position:absolute; top:-10px; display:flex; flex-direction:column; align-items:center; transform-origin:50% 0; }
  .colg .hilo { width:3px; flex:1; background:linear-gradient(rgba(244,210,122,.1), var(--maiz2)); }
  .colg .bola { border-radius:50%; position:relative; overflow:hidden; flex:none;
    background:radial-gradient(circle at 34% 30%, #fff7dc 0, #f4d27a 22%, #c98e1e 62%, #6e4308 100%); box-shadow:0 0 40px rgba(244,210,122,.6), 0 12px 26px rgba(0,0,0,.5); }
  .colg .bola img { position:absolute; inset:9%; width:82%; height:82%; opacity:.6; mix-blend-mode:multiply; }
</style></head><body>
<div id="lienzo"><div id="bokeh"></div><div id="colg"></div><svg id="guir" width="1080" height="200"></svg><div id="nieve"></div><img id="logo" src="../../img/marca/logo-loren.webp" alt=""></div>
<script>
const P = (a) => "../../" + a;
const D = window.DATOS;   // lo inyecta navidad_video.py desde herramientas/navidad_datos.py
const INTRO = 3.4, S = 4.4, SAL = 0.6, CTA_D = 5.0;
const N = D.combos.length, TB = (k) => INTRO + k * S, TOTAL = TB(N) + CTA_D;
window.DUR = TOTAL;
const L = document.getElementById("lienzo");
const clamp = (x) => Math.max(0, Math.min(1, x));
const eo = (x) => 1 - Math.pow(1 - clamp(x), 3);
const ei = (x) => Math.pow(clamp(x), 2.2);
const eio = (x) => 0.5 - 0.5 * Math.cos(Math.PI * clamp(x));
function el(h) { const d = document.createElement("div"); d.innerHTML = h.trim(); return d.firstChild; }
const rnd = (i, n) => { const x = Math.sin(i * 91.7 + n * 17.3) * 43758.5453; return x - Math.floor(x); };

// nieve: copos de ñandutí y estrellas cayendo despacio (deterministas)
const nv = document.getElementById("nieve"), NV = [];
for (let i = 0; i < 34; i++) {
  const estrella = i % 3 === 0;
  const e = estrella ? document.createElement("b") : document.createElement("img");
  if (estrella) e.textContent = "✦"; else { e.src = P("img/kv/flor-kv.webp"); const s = 26 + rnd(i, 1) * 50; e.style.width = e.style.height = s + "px"; }
  nv.appendChild(e);
  NV.push({ e, x: rnd(i, 2) * 1080, v: 45 + rnd(i, 3) * 70, ph: rnd(i, 4) * 2000, w: 20 + rnd(i, 5) * 50, f: .4 + rnd(i, 6), est: estrella });
}
// guirnalda de bombillas en dos curvas y bolas (doradas y burdeos) colgando de ella
const SAG = 86, gy = (x) => 14 + SAG * Math.abs(Math.sin(Math.PI * x / 540));
let pts = ""; for (let x = -10; x <= 1090; x += 6) pts += x + "," + gy(x).toFixed(1) + " ";
document.getElementById("guir").innerHTML = `<polyline points="${pts}" fill="none" stroke="#f4d27a" stroke-width="3" style="filter:drop-shadow(0 0 5px rgba(244,210,122,.9))"/>`;
const BOMB = [], BCOL = ["#fff3c4", "#f4d27a", "#ffb347", "#fff3c4", "#ffd27a"];
for (let k = 0, x = 20; x < 1080; x += 56, k++) {
  const d = 13 + (k % 3) * 3, c = BCOL[k % 5], e = document.createElement("div");
  e.className = "bomb"; Object.assign(e.style, { left: (x - d / 2) + "px", top: (gy(x) + 2) + "px", width: d + "px", height: (d * 1.25) + "px", background: c, boxShadow: `0 0 12px 4px ${c}, 0 0 30px 10px rgba(255,190,90,.45)` });
  L.appendChild(e); BOMB.push({ e, f: 1.3 + (k % 4) * .45, ph: k * 1.7 });
}
const cg = document.getElementById("colg"), CG = [];
[[105, 120, 92], [300, 50, 62], [780, 70, 70], [985, 150, 100]].forEach(([x, largo, d], i) => {
  const e = el(`<div class="colg" style="left:${x - d / 2}px;top:${gy(x)}px;width:${d}px;height:${largo + d + 10}px"><span class="hilo"></span><span class="tapa"></span><span class="bola${i % 2 ? " vino" : ""}" style="width:${d}px;height:${d}px"><img src="${P("img/kv/flor-kv.webp")}"></span></div>`);
  cg.appendChild(e); CG.push({ e, f: .6 + i * .17, a: 3 + i });
});
// luces desenfocadas (bokeh) que flotan despacio
const BK = [], bk = document.getElementById("bokeh"), BKC = ["244,210,122", "255,170,80", "255,236,190", "176,64,95"];
for (let i = 0; i < 18; i++) {
  const d = 60 + rnd(i, 21) * 190, c = BKC[i % 4], e = document.createElement("i");
  Object.assign(e.style, { width: d + "px", height: d + "px", background: `radial-gradient(circle, rgba(${c},.5) 0, rgba(${c},.18) 45%, rgba(${c},0) 70%)` });
  bk.appendChild(e); BK.push({ e, x: rnd(i, 22) * 1080 - d / 2, y: rnd(i, 23) * 1920 - d / 2, a: .3 + rnd(i, 24) * .5, f: .2 + rnd(i, 25) * .4, ph: rnd(i, 26) * 6 });
}

const ESC = [];
function nueva(html, ini, dur) { const s = el('<div class="esc">' + html + '</div>'); L.insertBefore(s, cg); const o = { s, ini, dur }; ESC.push(o); return o; }
const introE = nueva(`<img class="flor" style="top:930px;opacity:.5" src="${P("img/kv/flor-kv.webp")}">
  <div class="centro eyebrow" id="i_e" style="top:640px">Nochebuena 24 · Fin de Año 31</div>
  <div class="centro anton" id="i_t" style="top:720px;font-size:190px">Bocaditos<br>de Navidad</div>
  <div class="centro kau" id="i_s" style="top:1110px;font-size:110px">a la paraguaya</div>
  <div class="centro" id="i_c" style="top:1290px"><span class="cinta">¡Vy'apavẽ Navidad!</span></div>`, 0, INTRO);
introE.tipo = "intro";
const imgs = [];
D.combos.forEach((c, k) => {
  const src = c.foto ? P("para-loren/navidad/fotos-loren/" + c.foto + ".webp") : P("img/kv/flor-kv.webp");
  const items = c.items.slice(0, 4).join(" <i>✦</i> ") + (c.items.length > 4 ? " <i>✦</i> y más" : "");
  const o = nueva(`<div class="fondo"></div><img class="flor" src="${P("img/kv/flor-kv.webp")}">
    <div class="marco${c.foto ? "" : " sin"}"><img><div class="brillo"></div></div>
    <div class="txt"><div class="nom">${c.titulo}</div><div class="sub">${c.sub}</div><div class="items">${items}</div>
    <div class="pre"><small>${c.cantidad}</small><b>${c.precio}</b></div></div>`, TB(k), S);
  o.tipo = "plato"; o.k = k; o.dir = k % 2 ? -1 : 1; o.sin = !c.foto;
  o.s.querySelector(".fondo").style.backgroundImage = c.foto ? "url(" + src + ")" : "none";
  const im = o.s.querySelector(".marco img"); im.src = src; imgs.push(im);
  o.im = im; o.marco = o.s.querySelector(".marco");
});
const cierreE = nueva(`<img class="flor" style="top:900px;opacity:.45" src="${P("img/kv/flor-kv.webp")}">
  <div class="centro anton" id="c_v" style="top:560px;font-size:200px">Encarga ya</div>
  <div class="centro kau" id="c_k" style="top:790px;font-size:96px">tu Navidad paraguaya</div>
  <div class="centro" id="c_c" style="top:1520px"><span class="cinta" style="font-size:50px">¡Vy'apavẽ Navidad!</span></div>
  <div class="centro" id="c_w" style="top:990px;font-weight:700;font-size:44px;text-shadow:0 4px 24px rgba(0,0,0,.9)">Por WhatsApp</div>
  <div class="centro anton" id="c_n" style="top:1050px;font-size:120px;color:var(--maiz2)">${D.whatsapp}</div>
  <div class="centro" id="c_p" style="top:1240px"><span class="pill">${D.web}</span></div>
  <div class="centro" id="c_h" style="top:1380px;font-weight:600;font-size:34px;line-height:1.4;text-shadow:0 4px 20px rgba(0,0,0,.9)">Encarga con antelación · Recogida en<br>Carrer de la Muntanya 115 · Barcelona</div>`, TB(N), CTA_D);
cierreE.tipo = "cierre";

function ajusta(o) {   // foto ENTERA en una caja de 900 × 760 centrada en y = 760
  const w = o.im.naturalWidth, h = o.im.naturalHeight; let esc = Math.min(900 / w, 690 / h);
  let W = Math.round(w * esc), H = Math.round(h * esc);
  if (o.sin) { W = 620; H = 620; }
  Object.assign(o.marco.style, { width: W + "px", height: H + "px", left: ((1080 - W) / 2) + "px", top: (825 - H / 2) + "px" });
  o.W = W;
}

function render(t) {
  NV.forEach((b) => {
    const y = ((t * b.v + b.ph) % 2050) - 80, x = b.x + Math.sin(t * b.f + b.ph) * b.w;
    const o = (b.est ? 0.35 + 0.6 * Math.abs(Math.sin(t * 2 * b.f + b.ph)) : 0.5) * clamp(Math.min(y + 80, 1900 - y) / 220);
    b.e.style.transform = "translate(" + x + "px," + y + "px) rotate(" + (b.est ? 0 : t * 25 * b.f) + "deg)"; b.e.style.opacity = o;
  });
  CG.forEach((c) => (c.e.style.transform = "rotate(" + Math.sin(t * c.f) * c.a + "deg)"));
  BOMB.forEach((b) => (b.e.style.opacity = 0.55 + 0.45 * (0.5 + 0.5 * Math.sin(t * b.f * 2 + b.ph))));
  BK.forEach((b) => { b.e.style.transform = "translate(" + (b.x + Math.sin(t * b.f + b.ph) * 30) + "px," + (b.y - t * 12 * b.f) + "px)"; b.e.style.opacity = b.a * (0.75 + 0.25 * Math.sin(t * b.f * 1.5 + b.ph)); });
  ESC.forEach((o) => {
    const l = t - o.ini; const fin = o.tipo === "cierre" ? 1e9 : o.dur + SAL;
    if (l < -0.01 || l > fin) { o.s.style.visibility = "hidden"; return; }
    o.s.style.visibility = "visible";
    const fl = o.s.querySelector(".flor"); fl.style.transform = "rotate(" + ((t * 8) % 360) + "deg) scale(" + (0.85 + 0.15 * eo(l / 1.6)) + ")";
    if (o.tipo === "plato") {
      if (!o.W) ajusta(o);
      const d = o.dir, pe = eio(l / 0.9), ps = ei((l - o.dur) / SAL);
      const x = (1 - pe) * d * 1100 - ps * d * 1300, rot = (1 - pe) * d * -7 + ps * d * 6, sc = 0.9 + 0.1 * pe + 0.03 * clamp(l / o.dur);
      o.marco.style.transform = "translateX(" + x + "px) rotate(" + rot + "deg) scale(" + sc + ")";
      o.s.querySelector(".fondo").style.opacity = clamp(l / 0.7) * (1 - ps);
      const b = clamp((l - 0.7) / 0.8); o.s.querySelector(".brillo").style.left = (-50 + 190 * eio(b)) + "%";
      const tx = o.s.querySelector(".txt"), pt = eo((l - 0.45) / 0.7), pto = clamp((l - o.dur) / (SAL * 0.8));
      tx.style.opacity = pt * (1 - pto); tx.style.transform = "translateY(" + ((1 - pt) * 60 + pto * -40) + "px)";
      const pr = o.s.querySelector(".pre"); pr.style.transform = "scale(" + (0.7 + 0.3 * eo((l - 0.9) / 0.6)) + ")";
    } else if (o.tipo === "intro") {
      const ps = ei((l - o.dur) / SAL); o.s.style.opacity = 1 - ps;
      fl.style.transform = "rotate(" + ((t * 10) % 360) + "deg) scale(" + (0.25 + 0.85 * eo(l / 2.4)) + ")";
      [["i_e", 0.2], ["i_t", 0.5], ["i_s", 1.2], ["i_c", 1.7]].forEach(([id, dl]) => { const e = document.getElementById(id), p = eo((l - dl) / 0.9); e.style.opacity = p; e.style.transform = "translateY(" + ((1 - p) * 60) + "px)"; });
    } else {
      o.s.style.opacity = eo(l / 0.8); fl.style.transform = "rotate(" + ((t * 8) % 360) + "deg) scale(" + (0.5 + 0.5 * eo(l / 1.8)) + ")";
      [["c_v", 0.3], ["c_k", 0.8], ["c_w", 1.3], ["c_n", 1.5], ["c_p", 2.0], ["c_h", 2.4], ["c_c", 2.9]].forEach(([id, dl]) => { const e = document.getElementById(id), p = eo((l - dl) / 0.8); e.style.opacity = p; e.style.transform = "translateY(" + ((1 - p) * 50) + "px)"; });
    }
  });
  document.getElementById("logo").style.opacity = clamp((t - 0.2) / 0.6);
}
window.render = render;
Promise.all([document.fonts.ready, ...imgs.map((i) => i.decode().catch(() => {}))]).then(() => { render(0); window.LISTO = true; });
</script></body></html>
