<!doctype html>
<html lang="es"><head><meta charset="utf-8"><title>Navidad B</title>
<link rel="stylesheet" href="../../css/fuentes.css">
<style>
  :root { --vino:#59011d; --oro:#c98e1e; --oro2:#e8b43a; --tinta:#2a1a1e; }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:1080px; height:1920px; overflow:hidden; background:#f6eedd; }
  #lienzo { position:relative; width:1080px; height:1920px; overflow:hidden; font-family:Montserrat,sans-serif; color:var(--tinta);
    background:radial-gradient(rgba(89,1,29,.035) 1px, transparent 1.4px) 0 0/7px 7px, radial-gradient(120% 80% at 50% 40%, #fbf6ea, #efe2c6); }
  .encaje { position:absolute; mix-blend-mode:multiply; opacity:.17; }
  #conf { position:absolute; inset:0; z-index:2; pointer-events:none; }
  #conf b { position:absolute; left:0; top:0; color:var(--oro); line-height:1; }
  .cinta { position:absolute; left:0; width:1080px; height:84px; z-index:3; background:linear-gradient(#3d0014, #7d0b2e 28%, #b3194a 50%, #7d0b2e 72%, #3d0014);
    border-top:4px solid var(--oro2); border-bottom:4px solid var(--oro2); box-shadow:0 0 30px rgba(61,0,20,.35); }
  .lazo { position:absolute; z-index:8; filter:drop-shadow(0 14px 18px rgba(42,0,14,.45)); }
  .esc { position:absolute; inset:0; visibility:hidden; z-index:5; }
  .pola { position:absolute; background:#fffdf8; padding:22px 22px 96px; box-shadow:0 30px 60px -18px rgba(60,10,20,.55), 0 3px 8px rgba(0,0,0,.12); z-index:6; }
  .pola img { display:block; object-fit:cover; }
  .pola .pie { position:absolute; left:0; right:0; bottom:20px; text-align:center; font-family:"Kaushan Script"; color:var(--vino); font-size:52px; }
  .pola .adh { position:absolute; top:-26px; left:50%; width:240px; height:56px; margin-left:-120px; background:rgba(232,180,58,.55); transform:rotate(-4deg); box-shadow:0 2px 6px rgba(0,0,0,.12); }
  .txt { position:absolute; left:0; right:0; top:1235px; text-align:center; z-index:7; }
  .tit { font-family:"Kaushan Script"; color:var(--vino); font-size:120px; line-height:1; text-shadow:0 3px 0 rgba(255,255,255,.7); }
  .sub { font-family:Anton; text-transform:uppercase; letter-spacing:.18em; color:var(--oro); font-size:40px; margin-top:6px; }
  .items { margin-top:16px; padding:0 80px; font-weight:700; font-size:33px; line-height:1.38; }
  .items i { font-style:normal; color:var(--oro2); }
  .tagw { position:absolute; z-index:9; filter:drop-shadow(0 16px 20px rgba(60,10,20,.4)); transform-origin:-60px 50%; }
  .tag { display:inline-flex; flex-direction:column; background:linear-gradient(135deg, #f7ead0, #e6cf9c); color:var(--vino); padding:18px 40px 20px 92px; clip-path:polygon(52px 0, 100% 0, 100% 100%, 52px 100%, 0 50%); position:relative; }
  .tag::before { content:""; position:absolute; left:40px; top:50%; width:22px; height:22px; margin-top:-11px; border-radius:50%; background:#efe2c6; box-shadow:inset 0 0 0 3px var(--oro); }
  .tag small { font-weight:800; letter-spacing:.08em; text-transform:uppercase; color:var(--oro); font-size:26px; white-space:nowrap; }
  .tag b { font-family:Anton; font-weight:400; font-size:78px; line-height:1; white-space:nowrap; }
  .cordel { position:absolute; left:-70px; top:50%; width:90px; height:3px; background:var(--oro); }
  .centro { position:absolute; left:0; right:0; text-align:center; }
  .eyebrow { font-weight:800; letter-spacing:.26em; text-transform:uppercase; color:var(--oro); font-size:34px; }
  .pill { display:inline-block; background:var(--vino); color:#fff6e0; font-weight:800; font-size:46px; padding:24px 56px; border-radius:999px; box-shadow:0 18px 36px -12px rgba(89,1,29,.6), inset 0 0 0 4px var(--oro2); }
  #logo { position:absolute; left:50%; top:250px; width:250px; margin-left:-125px; z-index:10; filter:drop-shadow(0 6px 10px rgba(60,10,20,.25)); }
</style></head><body>
<div id="lienzo"><div id="conf"></div><img id="logo" src="../../img/marca/logo-loren.webp" alt=""></div>
<script>
const P = (a) => "../../" + a;
const D = window.DATOS;
const INTRO = 3.6, S = 4.4, SAL = 0.6, CTA_D = 5.0;
const N = D.combos.length, TB = (k) => INTRO + k * S, TOTAL = TB(N) + CTA_D;
window.DUR = TOTAL;
const L = document.getElementById("lienzo");
const clamp = (x) => Math.max(0, Math.min(1, x));
const eo = (x) => 1 - Math.pow(1 - clamp(x), 3);
const ei = (x) => Math.pow(clamp(x), 2.2);
const eio = (x) => 0.5 - 0.5 * Math.cos(Math.PI * clamp(x));
const back = (x) => { x = clamp(x); const c = 1.4; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };   // con un pequeño rebote suave al asentarse
function el(h) { const d = document.createElement("div"); d.innerHTML = h.trim(); return d.firstChild; }
const rnd = (i, n) => { const x = Math.sin(i * 91.7 + n * 17.3) * 43758.5453; return x - Math.floor(x); };
const LAZO = (id) => `<svg viewBox="0 0 200 160"><defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#b3194a"/><stop offset=".55" stop-color="#6d0624"/><stop offset="1" stop-color="#3d0014"/></linearGradient></defs>
<path d="M93 72 L58 150 L71 141 L79 156 L104 80Z" fill="url(#${id})" stroke="#e8b43a" stroke-width="1.5"/><path d="M107 72 L142 150 L129 141 L121 156 L96 80Z" fill="url(#${id})" stroke="#e8b43a" stroke-width="1.5"/>
<path d="M100 70 C 62 18, 4 22, 16 64 C 26 96, 72 92, 100 76Z" fill="url(#${id})" stroke="#e8b43a" stroke-width="2"/><path d="M100 70 C 138 18, 196 22, 184 64 C 174 96, 128 92, 100 76Z" fill="url(#${id})" stroke="#e8b43a" stroke-width="2"/>
<path d="M96 70 C 72 46, 42 46, 40 62 C 44 76, 76 78, 96 73Z" fill="#2a000e" opacity=".45"/><path d="M104 70 C 128 46, 158 46, 160 62 C 156 76, 124 78, 104 73Z" fill="#2a000e" opacity=".45"/>
<path d="M28 44 C 46 28, 74 34, 92 58" fill="none" stroke="#fff" stroke-opacity=".35" stroke-width="4" stroke-linecap="round"/>
<rect x="85" y="56" width="30" height="30" rx="10" fill="url(#${id})" stroke="#e8b43a" stroke-width="2"/></svg>`;

// encaje de ñandutí en las esquinas, girando muy despacio
const ENC = [];
[[-260, -200, 780], [560, 1380, 820]].forEach(([x, y, d]) => { const e = el(`<img class="encaje" src="${P("img/kv/flor-kv.webp")}" style="left:${x}px;top:${y}px;width:${d}px">`); L.insertBefore(e, L.firstChild); ENC.push(e); });
// confeti dorado cayendo
const cf = document.getElementById("conf"), CF = [];
for (let i = 0; i < 40; i++) {
  const e = document.createElement("b"), est = i % 3 !== 0; e.textContent = est ? "✦" : "●"; e.style.fontSize = (est ? 16 + rnd(i, 1) * 26 : 8 + rnd(i, 1) * 8) + "px";
  cf.appendChild(e); CF.push({ e, x: rnd(i, 2) * 1080, v: 40 + rnd(i, 3) * 70, ph: rnd(i, 4) * 2000, w: 15 + rnd(i, 5) * 40, f: .5 + rnd(i, 6), a: .35 + rnd(i, 7) * .5 });
}
// cinta que cruza la pantalla y lazo
const CY = 810;
const cinta = el(`<div class="cinta" style="top:${CY - 42}px"></div>`); L.appendChild(cinta);
const lazo = el(`<div class="lazo" style="left:${540 - 150}px;width:300px">${LAZO("lzv")}</div>`); L.appendChild(lazo);

const ESC = [];
function nueva(html, ini, dur) { const s = el('<div class="esc">' + html + '</div>'); L.appendChild(s); const o = { s, ini, dur }; ESC.push(o); return o; }
const introE = nueva(`<div class="centro eyebrow" id="i_e" style="top:430px">Nochebuena 24 · Fin de Año 31</div>
  <div class="centro tit" id="i_t" style="top:930px;font-size:170px;line-height:1.02">Bocaditos<br>de Navidad</div>
  <div class="centro sub" id="i_s" style="top:1310px;font-size:50px">· a la paraguaya ·</div>
  <div class="centro" id="i_g" style="top:1400px;font-family:'Kaushan Script';color:var(--vino);font-size:64px">¡Vy'apavẽ Navidad!</div>`, 0, INTRO);
introE.tipo = "intro";
const imgs = [];
D.combos.forEach((c, k) => {
  const items = c.items.slice(0, 4).join(" <i>✦</i> ") + (c.items.length > 4 ? " <i>✦</i> y más" : "");
  const o = nueva(`<div class="pola"><span class="adh"></span><img src="${P("para-loren/navidad/fotos-loren/" + c.foto + ".webp")}"><div class="pie">${c.titulo}</div></div>
    <div class="txt"><div class="tit">${c.titulo}</div><div class="sub">${c.sub}</div><div class="items">${items}</div></div>
    <div class="tagw"><span class="cordel"></span><div class="tag"><small>${c.cantidad}</small><b>${c.precio}</b></div></div>`, TB(k), S);
  o.tipo = "plato"; o.dir = k % 2 ? -1 : 1; o.rot = [-4, 3, -3, 4][k % 4];
  o.pola = o.s.querySelector(".pola"); o.im = o.s.querySelector(".pola img"); imgs.push(o.im);
  o.tag = o.s.querySelector(".tagw");
});
const cierreE = nueva(`<div class="centro tit" id="c_v" style="top:430px;font-size:160px">Encarga ya</div>
  <div class="centro sub" id="c_k" style="top:610px">· tu Navidad paraguaya ·</div>
  <div class="centro" id="c_w" style="top:965px;font-weight:700;font-size:42px">Por WhatsApp</div>
  <div class="centro" id="c_n" style="top:1020px;font-family:Anton;font-size:124px;color:var(--vino)">${D.whatsapp}</div>
  <div class="centro" id="c_p" style="top:1205px"><span class="pill">${D.web}</span></div>
  <div class="centro" id="c_h" style="top:1345px;font-weight:600;font-size:34px;line-height:1.4">Encarga con antelación · Recogida en<br>Carrer de la Muntanya 115 · Barcelona</div>
  <div class="centro" id="c_g" style="top:1462px;font-family:'Kaushan Script';color:var(--vino);font-size:62px">¡Vy'apavẽ Navidad!</div>`, TB(N), CTA_D);
cierreE.tipo = "cierre";

function ajusta(o) {   // foto ENTERA dentro de la polaroid (caja máx. 700 × 600)
  const w = o.im.naturalWidth, h = o.im.naturalHeight, esc = Math.min(700 / w, 600 / h);
  const W = Math.round(w * esc), H = Math.round(h * esc);
  o.im.style.width = W + "px"; o.im.style.height = H + "px";
  o.PW = W + 44; o.PH = H + 118;
  Object.assign(o.pola.style, { left: (540 - o.PW / 2) + "px", top: (CY - o.PH / 2 + 10) + "px" });
  Object.assign(o.tag.style, { left: Math.min(540 + o.PW / 2 - 150, 1080 - o.tag.offsetWidth - 40) + "px", top: (CY + o.PH / 2 - 70) + "px" });
}

function render(t) {
  CF.forEach((b) => { const y = ((t * b.v + b.ph) % 2050) - 80, x = b.x + Math.sin(t * b.f + b.ph) * b.w;
    b.e.style.transform = "translate(" + x + "px," + y + "px) rotate(" + (t * 40 * b.f) + "deg)"; b.e.style.opacity = b.a * clamp(Math.min(y + 80, 1900 - y) / 200); });
  ENC.forEach((e, i) => (e.style.transform = "rotate(" + (t * (i ? -4 : 4)) + "deg)"));
  // la cinta entra desde la izquierda y el lazo aparece en la intro; en el cierre la cinta se va
  const tc = TB(N);
  const ci = eo(t / 0.9);
  cinta.style.transform = "translateX(" + ((1 - ci) * -1100) + "px)";
  const lz = back((t - 0.6) / 0.8);
  const lazoY = CY - 120;
  lazo.style.zIndex = (t > INTRO - 0.2 && t < tc + SAL) ? 4 : 8;   // en los combos el lazo queda detrás de la foto, como si la atara
  lazo.style.top = lazoY + "px"; lazo.style.opacity = clamp((t - 0.6) / 0.3);
  lazo.style.transform = "scale(" + Math.max(0, lz) + ") rotate(" + Math.sin(t * 1.6) * 2.5 + "deg)";
  ESC.forEach((o) => {
    const l = t - o.ini; const fin = o.tipo === "cierre" ? 1e9 : o.dur + SAL;
    if (l < -0.01 || l > fin) { o.s.style.visibility = "hidden"; return; }
    o.s.style.visibility = "visible";
    if (o.tipo === "plato") {
      if (!o.PW) ajusta(o);
      const pe = back(l / 0.9), ps = ei((l - o.dur) / SAL);
      const y = (1 - pe) * -1300 + ps * 1500, rot = o.rot + (1 - clamp(l / 0.9)) * 14 * o.dir + ps * 10 * o.dir;
      o.pola.style.transform = "translateY(" + y + "px) rotate(" + rot + "deg)";
      const tl = clamp((l - 0.7) / 0.5), sw = Math.exp(-2.2 * Math.max(0, l - 0.7)) * Math.sin((l - 0.7) * 7) * 16;
      o.tag.style.opacity = tl * (1 - ps); o.tag.style.transform = "translateY(" + (ps * 1500) + "px) rotate(" + (-6 + sw * tl) + "deg) scale(" + (0.6 + 0.4 * eo((l - 0.7) / 0.5)) + ")";
      const tx = o.s.querySelector(".txt"), pt = eo((l - 0.5) / 0.7), pto = clamp((l - o.dur) / (SAL * 0.8));
      tx.style.opacity = pt * (1 - pto); tx.style.transform = "translateY(" + ((1 - pt) * 60 + pto * -40) + "px)";
    } else if (o.tipo === "intro") {
      const ps = ei((l - o.dur) / SAL); o.s.style.opacity = 1 - ps;
      [["i_e", 0.3], ["i_t", 0.9], ["i_s", 1.5], ["i_g", 2.0]].forEach(([id, dl]) => { const e = document.getElementById(id), p = eo((l - dl) / 0.8); e.style.opacity = p; e.style.transform = "translateY(" + ((1 - p) * 50) + "px)"; });
    } else {
      o.s.style.opacity = eo(l / 0.7);
      [["c_v", 0.4], ["c_k", 0.8], ["c_w", 1.2], ["c_n", 1.4], ["c_p", 1.9], ["c_h", 2.3], ["c_g", 2.8]].forEach(([id, dl]) => { const e = document.getElementById(id), p = eo((l - dl) / 0.8); e.style.opacity = p; e.style.transform = "translateY(" + ((1 - p) * 50) + "px)"; });
    }
  });
  document.getElementById("logo").style.opacity = clamp((t - 0.2) / 0.6);
}
window.render = render;
Promise.all([document.fonts.ready, ...imgs.map((i) => i.decode().catch(() => {}))]).then(() => { render(0); window.LISTO = true; });
</script></body></html>
