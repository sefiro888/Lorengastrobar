  <style>
    :root { --f-display: "Fraunces", Georgia, serif; --f-body: "DM Sans", system-ui, sans-serif; --f-script: "Yellowtail", cursive; }
    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body { background: #3a1019; font-family: var(--f-body); -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    .barra { position: sticky; top: 0; z-index: 10; display: flex; gap: 10px; justify-content: center; align-items: center; flex-wrap: wrap; padding: 14px 16px; background: rgba(42,0,14,.92); backdrop-filter: blur(10px); }
    .barra a, .barra button { font: 700 .9rem var(--f-body); border: 0; border-radius: 999px; padding: .75em 1.3em; cursor: pointer; text-decoration: none; }
    .barra .primario { background: #e8b43a; color: #2a000e; }
    .barra .sec { background: rgba(243,238,220,.12); color: #f3eedc; }
    .barra span { color: rgba(243,238,220,.6); font-size: .82rem; }
    .hojas { display: grid; gap: 36px; justify-content: center; padding: 36px 16px 60px; }
    @media (max-width: 860px) { .hojas { padding: 20px 0 40px; gap: 20px; } }
    @page { size: A4; margin: 0; }
    @media print {
      body { background: none; }
      .barra { display: none; }
      .hojas { display: block; padding: 0; }
      .cc .hoja { box-shadow: none; width: 210mm; height: 297mm; min-height: 0; page-break-after: always; break-after: page; }
      .cc .hoja:last-child { page-break-after: auto; break-after: auto; }
    }
  </style>
